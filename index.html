<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GlobalMatrix turns global events into a map, a timeline and a list of who is exposed. Free to explore — no account needed." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#080B10" />
  <!-- Fonts are declared here rather than imported from CSS so the browser
       starts the download during head parsing, in parallel with the bundle,
       instead of discovering them after the stylesheet resolves. `display=swap`
       means text renders in the fallback immediately and never reflows into a
       blank frame. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@400;500;700&display=swap"
  />
  <title>GlobalMatrix — Global risk intelligence</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
